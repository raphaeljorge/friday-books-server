openapi: 3.0.0
    info:
      title: Book Management API
      version: 1.0.0
      description: Comprehensive API for managing books, ebooks, and audiobooks

    servers:
      - url: http://localhost:8080/api/v1
        description: Development server

    paths:
      /books:
        post:
          summary: Create a new book
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Book'
          responses:
            '201':
              description: Book created successfully
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/Book'
            '400':
              description: Invalid input
            '500':
              description: Internal server error

    components:
      schemas:
        Book:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
            authors:
              type: array
              items:
                type: string
            description:
              type: string
            # Add more properties...
