version: '3.8'

    services:
      app:
        build: .
        ports:
          - "8080:8080"
        environment:
          - DB_HOST=db
          - DB_PORT=5432
          - DB_USER=postgres
          - DB_PASSWORD=postgres
          - DB_NAME=books
          - REDIS_ADDR=redis:6379
          - JWT_SECRET=your-secret-key
        depends_on:
          - db
          - redis

      db:
        image: postgres:15
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: books
        ports:
          - "5432:5432"
        volumes:
          - postgres_data:/var/lib/postgresql/data

      redis:
        image: redis:7
        ports:
          - "6379:6379"
        volumes:
          - redis_data:/data

    volumes:
      postgres_data:
      redis_data:
